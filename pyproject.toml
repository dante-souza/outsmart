[project]
name = "outsmart"
version = "0.1.0"
description = "A battle of diplomacy and deviousness between LLMs"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.83.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pymongo>=4.19.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
    "streamlit==1.66.1",
    "trueskill>=0.4.5",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.1.1",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
